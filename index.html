<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="大判カメラ" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>大判カメラ</title>
    <script type="module" crossorigin src="./assets/index-CKEGMABT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CLNwa_Dg.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">4×5 <span>LARGE FORMAT</span></div>
        <div class="readout" id="readout">150mm · f/22</div>
        <button class="icon-btn" id="btn-gallery" aria-label="ギャラリー">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
        </button>
      </header>

      <main class="viewer">
        <div class="hood" id="hood">
          <canvas id="gg"></canvas>
          <div class="focus-mark" id="focus-mark"></div>
          <div class="badges">
            <span class="badge" id="badge-mode">ピントグラス</span>
            <span class="badge warn" id="badge-fov" hidden>スマホの画角外</span>
            <span class="badge warn" id="badge-vig" hidden>ケラレ</span>
          </div>
          <div class="depth-status" id="depth-status">深度モデル 準備中…</div>
          <div class="develop" id="develop" hidden>
            <div class="develop-inner"><div class="spinner"></div><div id="develop-text">現像中…</div></div>
          </div>
          <div class="placeholder" id="placeholder">
            <p>カメラを起動するか、写真を読み込んでください</p>
            <button class="pill" id="btn-start">カメラを起動</button>
          </div>
        </div>
        <p class="hint" id="hint">ピントグラスをタップしてピント合わせ</p>
      </main>

      <section class="controls">
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="focus">ピント</button>
          <button class="tab" data-tab="move">あおり</button>
          <button class="tab" data-tab="lens">レンズ</button>
          <button class="tab" data-tab="film">フィルム</button>
        </nav>

        <div class="panel active" data-panel="focus">
          <label class="row"><span>被写体距離</span><input type="range" id="sRef" min="0" max="1000" /><output id="sRef-o"></output></label>
          <label class="row"><span>ピント送り</span><input type="range" id="focusOffset" min="-8" max="8" step="0.05" /><output id="focusOffset-o"></output></label>
          <p class="note">タップした点までの実際の距離を「被写体距離」に合わせると、ボケの量が実物の4×5に近づきます。</p>
        </div>

        <div class="panel" data-panel="move">
          <label class="row"><span>ライズ</span><input type="range" id="rise" step="0.5" /><output id="rise-o"></output></label>
          <label class="row"><span>シフト</span><input type="range" id="shift" step="0.5" /><output id="shift-o"></output></label>
          <label class="row"><span>前ティルト</span><input type="range" id="tiltFront" step="0.25" /><output id="tiltFront-o"></output></label>
          <label class="row"><span>前スイング</span><input type="range" id="swing" step="0.25" /><output id="swing-o"></output></label>
          <label class="row"><span>後ティルト</span><input type="range" id="tiltRear" step="0.25" /><output id="tiltRear-o"></output></label>
          <div class="row-btns">
            <button class="pill small" id="btn-ring">イメージサークル表示</button>
            <button class="pill small" id="btn-reset-move">ゼロに戻す</button>
          </div>
        </div>

        <div class="panel" data-panel="lens">
          <div class="row"><span>レンズ</span><div class="seg" id="seg-lens"></div></div>
          <div class="row"><span>絞り</span><div class="seg scroll" id="seg-N"></div></div>
          <div class="row"><span>スマホのレンズ</span><select id="device"></select></div>
          <label class="row"><span>換算焦点距離</span><input type="range" id="feq" min="12" max="80" step="1" /><output id="feq-o"></output></label>
        </div>

        <div class="panel" data-panel="film">
          <div class="row"><span>フィルム</span><div class="seg" id="seg-stock"></div></div>
          <div class="row"><span>向き</span><div class="seg" id="seg-orient"></div></div>
          <label class="row"><span>露出補正</span><input type="range" id="exposure" min="-2" max="2" step="0.1" /><output id="exposure-o"></output></label>
          <label class="row"><span>粒状</span><input type="range" id="grain" min="0" max="2" step="0.05" /><output id="grain-o"></output></label>
          <div class="row-btns">
            <button class="pill small" id="btn-frame">黒フチ</button>
            <button class="pill small" id="btn-invert">倒立像</button>
            <button class="pill small" id="btn-dim">絞ると暗く</button>
          </div>
        </div>
      </section>

      <footer class="bar">
        <div class="slot left">
          <button class="side-btn" id="btn-import">
            <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            <span>読込</span>
          </button>
          <button class="side-btn" id="btn-back" hidden>
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            <span>撮り直す</span>
          </button>
        </div>
        <button class="shutter" id="btn-shutter" aria-label="撮影"><span></span></button>
        <div class="slot right">
          <button class="side-btn" id="btn-save" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
            <span>現像・保存</span>
          </button>
        </div>
      </footer>

      <input type="file" id="file" accept="image/*" hidden />
    </div>

    <dialog id="gallery">
      <div class="gal-head">
        <h2>現像済みシート</h2>
        <button class="icon-btn" id="gal-close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="gal-grid" id="gal-grid"></div>
      <div class="gal-view" id="gal-view" hidden>
        <img id="gal-img" alt="" />
        <div class="gal-actions">
          <button class="pill" id="gal-share">保存・共有</button>
          <button class="pill danger" id="gal-delete">削除</button>
          <button class="pill" id="gal-back">一覧へ</button>
        </div>
      </div>
    </dialog>

    <video id="video" playsinline muted hidden></video>
  </body>
</html>
